version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/joyflix.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: joyflix-core
    bump: patch

build:
  run_buildscript: false

images:
  # 主应用：上游 ghcr.io/jeffernn/joyflix 以 push-by-digest 发布（当前无 tag，仅有 digest），
  # 但上游 CI 设计会在默认分支打 latest tag → 用 latest 家族 + bump: patch，tag 出现后自动更新
  - id: joyflix-core
    target: service
    service: joyflix-core
    source: ghcr.io/jeffernn/joyflix
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat
  # 辅助 redis：跟随 7.x-alpine 补丁家族
  - id: joyflix-redis
    target: service
    service: joyflix-redis
    source: library/redis
    channel: custom
    sort: semver
    tag_regex: '^7\.\d+-alpine$'
    version_regex: '^(?P<version>7\.\d+)-alpine$'
    version_template: '{version}.0'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: JoyFlix
    summary: "基于 MoonTV 完全重构的影视播放平台"
